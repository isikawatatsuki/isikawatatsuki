name: Generate profile cards

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile_cards.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate statistics and language cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_cards.py
      - name: Commit generated cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/github-stats.svg assets/language-stats.svg
          if git diff --cached --quiet; then
            echo "No card changes"
          else
            git commit -m "chore: update profile cards"
            git push
          fi
